name: Bun native AOT package

on:
  push:
    branches: [bun]
  pull_request:
    branches: [bun]
  workflow_dispatch:
    inputs:
      runners:
        description: JSON array of native runner labels (empty builds all targets)
        type: string
        default: ""
      release_tag:
        description: Existing release to upload validated assets to
        type: string
        default: bun-aot-v0.16.0

permissions:
  contents: read

concurrency:
  group: bun-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-24.04","macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop-bun/src-tauri/target
          key: tauri-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop-bun/src-tauri/Cargo.lock') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev pkg-config
      - run: bun --revision
      - id: platform
        run: echo "name=$(node -p 'process.platform + "-" + process.arch')" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run postinstall
      - run: bun run build:desktop:bun
      - run: bun test packages/desktop-bun/src/ui-host.test.ts
      - run: npx vitest run --config packages/server/vitest.config.ts packages/server/src/server/paseo-env.test.ts
      - run: bun test scripts/aot-module-path.test.ts scripts/trace-path.test.ts scripts/linux-desktop.test.ts
      - if: runner.os != 'Windows'
        run: bun run test:bun
      - if: runner.os == 'Windows'
        run: bun scripts/test-bun-windows.ts
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-bun-${{ steps.platform.outputs.name }}-aot
          path: |
            dist/*-aot.tar.gz
            dist/*-aot.tar.gz.sha256
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*-aot.tar.gz dist/*-aot.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop-bun/src-tauri/target
          key: tauri-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop-bun/src-tauri/Cargo.lock') }}
