name: Bun native AOT package

on:
  push:
    branches: [bun]
  pull_request:
    branches: [bun]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev pkg-config
      - run: bun --revision
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run postinstall
      - run: bun run build:desktop:bun
      - run: bun test packages/desktop-bun/src/ui-host.test.ts
      - run: npx vitest run --config packages/server/vitest.config.ts packages/server/src/server/paseo-env.test.ts
      - run: bun test scripts/aot-module-path.test.ts
      - run: bun run test:bun
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-bun-linux-x64-aot
          path: |
            dist/*-aot.tar.gz
            dist/*-aot.tar.gz.sha256
          if-no-files-found: error
